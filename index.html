<!DOCTYPE html>
<html>
  <head>
    <title>Jadwal-Pelaran-XIRPL</title>
    <link rel="stylesheet" href="style.css">
  </head>
 <div class="container">
<h1>📚 Jadwal Pelajaran XI RPL</h1>
<p class="hari"></p>
<table id="jadwalTabel">
<thead>
<tr>
<th>Mata Pelajaran</th>
<th>Guru Pengajar</th>
<th>Waktu</th>
</tr>
</thead>
<tbody></tbody>
</table>
</div>


<script>
const jadwal = {
Senin: [
{ mapel: "Matematika", guru: "Ibu Riska", waktu: "08.00 - 09.45" },
{ mapel: "Kons.Keahlian RPL(BD)", guru: "Ibu Latifah", waktu: "10.15 - 14.30" },
],
Selasa: [
{ mapel: "Kons.Keahlian RPL(PBTGM)", guru: "Pak Hendrik", waktu: "07.00 - 09.20" },
{ mapel: "Kons.Keahlian RPL 1(PWEB)", guru: "Ibu Latifah", waktu: "09.50 - 12.10" },
{ mapel: "Pendidikan Agama Islam", guru: "Pak Hamidi", waktu: "12.45 - 14.30" }
],
Rabu: [
{ mapel: "Bahasa Inggris", guru: "Ibu Yeni", waktu: "07.00 - 09.20" },
{ mapel: "Mapel Pilihan(FBEWD)", guru: "Ibu Latifah", waktu: "09.50 - 12.10" },
{ mapel: "Bimbingan dan Konseling(BK)", guru: "Ibu Kiki", waktu: "12.45 - 13.20" },
{ mapel: "Bahasa Daerah", guru: "Ibu Ayu", waktu: "13.20 - 14.30" }
],
Kamis: [
{ mapel: "PJOK", guru: "Pak Aan", waktu: "06.00 - 08.10" },
{ mapel: "PPKN", guru: "Pak Mad", waktu: "08.10 - 09.20" },
{ mapel: "Kons.Keahlian RPL(PPB)", guru: "Pak Hendrik", waktu: "09.50 - 12.10" },
{ mapel: "Bahasa Indonesia", guru: "Ibu Juhairiyah", waktu: "12.45 - 14.30" }
],
Jumat: [
{ mapel: "Kewirausahaan", guru: "Pak Adam", waktu: "07.55 - 10.00" },
{ mapel: "Sejarah", guru: "Pak Dayat", waktu: "10.00 - 10.50" }
]
};


const hari = new Date().toLocaleDateString('id-ID', { weekday: 'long' });
const tabelBody = document.querySelector('#jadwalTabel tbody');
const hariEl = document.querySelector('.hari');


let jadwalHariIni = jadwal[hari];


if (!jadwalHariIni) {
tabelBody.innerHTML = `<tr><td colspan='3' class='libur'>Hari ini libur! 🎉</td></tr>`;
hariEl.textContent = `Hari ini: ${hari} (Libur)`;
} else {
hariEl.textContent = `Hari ini: ${hari}`;
jadwalHariIni.forEach(item => {
const row = `<tr><td>${item.mapel}</td><td>${item.guru}</td><td>${item.waktu}</td></tr>`;
tabelBody.insertAdjacentHTML('beforeend', row);
});
}
</script>
  </body>
</html>
