<!DOCTYPE html>
<html>
  <head>
    <title></title>
    <link rel="stylesheet" href="style.css">
  </head>
 <div class="container">
<h1>📚 Jadwal Pelajaran XI RPL</h1>
<p class="hari"></p>
<table id="jadwalTabel">
<thead>
<tr>
<th>Mata Pelajaran</th>
<th>Guru Pengajar</th>
<th>Waktu</th>
</tr>
</thead>
<tbody></tbody>
</table>
</div>


<script>
const jadwal = {
Senin: [
{ mapel: "Pemrograman Web", guru: "Pak Rudi", waktu: "07.00 - 08.30" },
{ mapel: "Basis Data", guru: "Bu Wulan", waktu: "08.45 - 10.15" },
{ mapel: "Bahasa Inggris", guru: "Bu Sinta", waktu: "10.30 - 12.00" }
],
Selasa: [
{ mapel: "PBO (Python)", guru: "Pak Andi", waktu: "07.00 - 08.30" },
{ mapel: "MTK", guru: "Bu Fitri", waktu: "08.45 - 10.15" },
{ mapel: "Agama", guru: "Pak Hadi", waktu: "10.30 - 12.00" }
],
Rabu: [
{ mapel: "PWPB", guru: "Pak Rudi", waktu: "07.00 - 08.30" },
{ mapel: "PKK", guru: "Bu Fika", waktu: "08.45 - 10.15" },
{ mapel: "Bahasa Indonesia", guru: "Bu Nisa", waktu: "10.30 - 12.00" }
],
Kamis: [
{ mapel: "PBO (Java)", guru: "Pak Andi", waktu: "07.00 - 08.30" },
{ mapel: "PJOK", guru: "Pak Dani", waktu: "08.45 - 10.15" },
{ mapel: "Sejarah", guru: "Bu Laila", waktu: "10.30 - 12.00" }
],
Jumat: [
{ mapel: "Basis Data", guru: "Bu Wulan", waktu: "07.00 - 08.30" },
{ mapel: "Pendidikan Pancasila", guru: "Pak Hadi", waktu: "08.45 - 10.15" }
]
};


const hari = new Date().toLocaleDateString('id-ID', { weekday: 'long' });
const tabelBody = document.querySelector('#jadwalTabel tbody');
const hariEl = document.querySelector('.hari');


let jadwalHariIni = jadwal[hari];


if (!jadwalHariIni) {
tabelBody.innerHTML = `<tr><td colspan='3' class='libur'>Hari ini libur! 🎉</td></tr>`;
hariEl.textContent = `Hari ini: ${hari} (Libur)`;
} else {
hariEl.textContent = `Hari ini: ${hari}`;
jadwalHariIni.forEach(item => {
const row = `<tr><td>${item.mapel}</td><td>${item.guru}</td><td>${item.waktu}</td></tr>`;
tabelBody.insertAdjacentHTML('beforeend', row);
});
}
</script>
  </body>
</html>
